version: '3.8'

services:
  bot:
    build: .
    container_name: crewai-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - LOGTAIL_SOURCE_TOKEN=${LOGTAIL_SOURCE_TOKEN}
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/.cache   # для кэширования SEO
    mem_limit: 2g
    cpus: '1.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]  # если добавить эндпоинт
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s